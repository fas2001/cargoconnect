      operationId: backoffice_users_activation_create
      description: Suspendre ou réactiver un compte (fraude, abus...). Un compte de
        l'équipe ne se suspend pas d'ici.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
