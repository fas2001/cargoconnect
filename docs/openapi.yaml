            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/cargos/:
    get:
      operationId: cargos_list
      description: |-
        `GET /cargos/` : place de marché (annonces publiées des autres utilisateurs).
        `GET /cargos/mine/` : annonces de l'utilisateur, tous statuts.
      parameters:
      - in: query
        name: category
        schema:
          type: number
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: destination_city
        schema:
          type: number
      - in: query
        name: origin_city
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - assigned
            - cancelled
            - completed
            - draft
            - expired
            - published
        description: |-
          * `draft` - Brouillon
          * `published` - Publiée
          * `assigned` - Attribuée
          * `completed` - Livrée
          * `cancelled` - Annulée
          * `expired` - Expirée
        explode: true
        style: form
      - in: query
        name: truck_type
        schema:
          type: array
          items:
            type: string
            title: Type de camion
            enum:
            - bache
            - benne
            - citerne
            - fourgon
            - frigorifique
            - pickup
            - plateau
            - porte_char
            - porte_conteneur
        description: |-
          * `plateau` - Plateau
          * `bache` - Bâché / Savoyarde
          * `fourgon` - Fourgon
          * `benne` - Benne
          * `frigorifique` - Frigorifique
          * `citerne` - Citerne
          * `porte_conteneur` - Porte-conteneur
          * `porte_char` - Porte-char / Porte-engins
          * `pickup` - Pick-up / Utilitaire
        explode: true
        style: form
      - in: query
        name: weight_max
        schema:
          type: number
      - in: query
        name: weight_min
        schema:
          type: number
      tags:
      - cargos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCargoListList'
          description: ''
    post:
      operationId: cargos_create
      description: |-
        `GET /cargos/` : place de marché (annonces publiées des autres utilisateurs).
        `GET /cargos/mine/` : annonces de l'utilisateur, tous statuts.
      tags:
      - cargos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CargoWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CargoWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoDetail'
          description: ''
  /api/cargos/{id}/:
