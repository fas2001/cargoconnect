openapi: 3.0.3
info:
  title: CargoConnect API
  version: 0.1.0
  description: API de mise en relation expéditeurs / transporteurs (MVP Maroc).
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/cargos/:
    get:
      operationId: cargos_list
      description: |-
        `GET /cargos/` : place de marché (annonces publiées des autres utilisateurs).
        `GET /cargos/mine/` : annonces de l'utilisateur, tous statuts.
      parameters:
      - in: query
        name: category
        schema:
          type: number
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: destination_city
        schema:
          type: number
      - in: query
        name: origin_city
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - assigned
            - cancelled
            - completed
            - draft
            - expired
            - published
        description: |-
          * `draft` - Brouillon
          * `published` - Publiée
          * `assigned` - Attribuée
          * `completed` - Livrée
          * `cancelled` - Annulée
          * `expired` - Expirée
        explode: true
        style: form
      - in: query
        name: truck_type
        schema:
          type: array
          items:
            type: string
            title: Type de camion
            enum:
            - bache
            - benne
            - citerne
            - fourgon
            - frigorifique
            - pickup
            - plateau
            - porte_char
            - porte_conteneur
        description: |-
          * `plateau` - Plateau
          * `bache` - Bâché / Savoyarde
          * `fourgon` - Fourgon
          * `benne` - Benne
          * `frigorifique` - Frigorifique
          * `citerne` - Citerne
          * `porte_conteneur` - Porte-conteneur
          * `porte_char` - Porte-char / Porte-engins
          * `pickup` - Pick-up / Utilitaire
        explode: true
        style: form
      - in: query
        name: weight_max
        schema:
          type: number
      - in: query
        name: weight_min
        schema:
          type: number
      tags:
      - cargos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCargoListList'
          description: ''
    post:
      operationId: cargos_create
      description: |-
        `GET /cargos/` : place de marché (annonces publiées des autres utilisateurs).
        `GET /cargos/mine/` : annonces de l'utilisateur, tous statuts.
      tags:
      - cargos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CargoWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CargoWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoDetail'
          description: ''
  /api/cargos/{id}/:
    get:
      operationId: cargos_retrieve
      description: |-
        `GET /cargos/` : place de marché (annonces publiées des autres utilisateurs).
        `GET /cargos/mine/` : annonces de l'utilisateur, tous statuts.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cargaison.
        required: true
      tags:
      - cargos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoDetail'
          description: ''
    patch:
      operationId: cargos_partial_update
      description: |-
        `GET /cargos/` : place de marché (annonces publiées des autres utilisateurs).
        `GET /cargos/mine/` : annonces de l'utilisateur, tous statuts.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cargaison.
        required: true
      tags:
      - cargos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCargoWriteRequest'
          application/x-www-form-urlencoded:
            schema:
