components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CargoClient:
      type: object
      properties:
        name:
          type: string
        rating:
          type: string
          readOnly: true
        member_since:
          type: string
          format: date-time
      required:
      - member_since
      - name
      - rating
    CargoDetail:
      type: object
      description: |-
        Les adresses précises ne sont visibles que par l'auteur de l'annonce et le chauffeur retenu.
        Les autres chauffeurs ne voient que les villes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Titre
          maxLength: 120
        category:
          allOf:
          - $ref: '#/components/schemas/GoodsCategory'
          readOnly: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Poids (kg)
        volume_m3:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          title: Volume (m³)
        truck_type:
          allOf:
          - $ref: '#/components/schemas/TruckTypeEnum'
          title: Type de camion
        truck_type_label:
          type: string
          readOnly: true
        origin_city:
          allOf:
          - $ref: '#/components/schemas/City'
          readOnly: true
        destination_city:
          allOf:
          - $ref: '#/components/schemas/City'
          readOnly: true
        loading_date:
          type: string
          format: date
          title: Date de chargement souhaitée
        proposed_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Prix proposé
        agreed_price:
          type: string
          nullable: true
          description: 'Tarif de l''offre acceptée : visible seulement par le client
            et le chauffeur retenu.'
          readOnly: true
        currency:
          type: string
          maxLength: 3
        status:
          $ref: '#/components/schemas/CargoStatusEnum'
        status_label:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        offers_count:
          type: string
          readOnly: true
        thumbnail:
          type: string
          readOnly: true
        is_mine:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Créé le
        description:
          type: string
        instructions:
          type: string
        origin_address:
          type: string
          title: Adresse de chargement
          maxLength: 255
        destination_address:
          type: string
          title: Adresse de livraison
          maxLength: 255
        declared_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          title: Valeur déclarée de la marchandise
        recipient_name:
          type: string
          title: Destinataire (nom)
          maxLength: 150
        recipient_phone:
          type: string
          title: Destinataire (téléphone)
          maxLength: 16
        goods_declaration_at:
          type: string
          format: date-time
          nullable: true
          title: Déclaration de conformité acceptée le
          description: Le client certifie que la marchandise est licite et conforme
            à la description.
        photos:
          type: array
          items:
            $ref: '#/components/schemas/CargoPhoto'
          readOnly: true
        client:
