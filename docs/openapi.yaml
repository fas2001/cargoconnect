  /api/offers/{id}/:
    get:
      operationId: offers_retrieve
      description: |-
        Un chauffeur gère ses offres (modifier, retirer) ; l'auteur de l'annonce les accepte ou les refuse.
        Une offre n'est visible que par ces deux personnes.
      parameters:
      - in: path
        name: id
        schema:
